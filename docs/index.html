<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Image Saver</title>
  <style>
    :root { --fondo: #f2f3f5; --riquadro: #fff; --testo: #1f2328; --tenue: #59636e; --accento: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #1b1d21; --riquadro: #26292e; --testo: #e6e8eb; --tenue: #9aa3ad; --accento: #5b8def; } }
    body { margin: 0; padding: 24px 16px; background: var(--fondo); color: var(--testo);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    section { background: var(--riquadro); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
    h1 { font-size: 26px; margin: 0 0 8px; } a { color: var(--accento); }
  </style>
</head>
<body>
<main>
  <section>
    <h1>Clean Image Saver</h1>
    <p>Right-click any image on the web and save it as PNG, JPG or WebP. Converted locally in your browser,
       no data collected, open source (MIT).</p>
    <p><a href="privacy.html">Privacy policy</a> ·
       <a href="https://github.com/kybernia-software/clean-image-saver">Source code</a> ·
       <a href="https://github.com/kybernia-software/clean-image-saver/issues">Questions and problems</a></p>
    <p>Made by Kybernia.</p>
  </section>
</main>
</body>
</html>
